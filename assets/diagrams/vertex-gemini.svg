strained output</text><rect x="26" y="233" width="319" height="26" rx="7" fill="#ece7db" stroke="#e6e0d3" stroke-width="1"/><text x="39" y="250" fill="#3a362c" font-size="10">● selective Bedrock escalation + cost controls</text><rect x="355" y="233" width="274" height="26" rx="7" fill="#ece7db" stroke="#e6e0d3" stroke-width="1"/><text x="368" y="250" fill="#3a362c" font-size="10">● unreviewed AI excluded from final KPI</text></svg>
